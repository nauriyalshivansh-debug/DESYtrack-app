<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1720" />
<link rel="icon" href="/icon-192.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DESYtrack" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<title>DESYtrack — Lab Sample Tracking</title>
<style>
  :root{
    --bg:#0f1720; --panel:#17212e; --panel2:#1e2b3a; --line:#2b3a4d;
    --ink:#e7edf3; --muted:#9fb0c3; --accent:#4f9cf9; --accent2:#2bb673;
    --warn:#e0a83e; --danger:#e5695f; --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink)}
  a{color:var(--accent);text-decoration:none}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:8px 14px;background:var(--accent);color:#fff}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  button.sm{padding:5px 10px;font-size:13px}
  input,select,textarea{font:inherit;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
       border-radius:8px;padding:8px 10px;width:100%}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:0}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;
       background:var(--panel);border-bottom:1px solid var(--line)}
  header .brand{font-weight:700;font-size:16px;letter-spacing:.3px}
  header .brand span{color:var(--accent)}
  .who{font-size:13px;color:var(--muted)}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;
       background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  main{max-width:1100px;margin:0 auto;padding:20px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:20px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .tile .n{font-size:26px;font-weight:700}
  .tile .l{font-size:12px;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  tr.click{cursor:pointer}
  tr.click:hover{background:var(--panel2)}
  .status{padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
  .s-received{background:#26333f;color:#cfe0f0}
  .s-registered{background:#2a3550;color:#c8d4ff}
  .s-in_testing{background:#3a3320;color:#f0d79a}
  .s-on_hold{background:#3f2a2a;color:#f3c0bb}
  .s-completed{background:#20362b;color:#a6e6c4}
  .s-shared{background:#233a44;color:#a9e0ef}
  .s-archived,.s-disposed{background:#2b2b2b;color:#bbb}
  .s-with_industry{background:#2c2540;color:#d9c9ff}
  .s-in_transit_desy,.s-in_transit_return{background:#33302a;color:#e6d3a0}
  .s-desy_storage{background:#24303a;color:#bcd3e6}
  .s-at_beamline{background:#12333a;color:#8fe4ef}
  .s-measured{background:#1f3a2c;color:#a6e6c4}
  .s-returned{background:#203629;color:#b8e6b0}
  .timeline{list-style:none;padding:0;margin:0}
  .timeline li{position:relative;padding:0 0 14px 20px;border-left:2px solid var(--line)}
  .timeline li:last-child{border-left-color:transparent}
  .timeline li::before{content:"";position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .timeline .t{font-size:12px;color:var(--muted)}
  .muted{color:var(--muted)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:640px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .toolbar input,.toolbar select{width:auto;flex:0 1 auto}
  .err{color:var(--danger);font-size:13px;margin-top:8px}
  .pill{font-size:11px;padding:1px 7px;border-radius:12px;border:1px solid var(--line);color:var(--muted)}
  .login-wrap{max-width:360px;margin:8vh auto}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.7}
  h2{font-size:18px;margin:0 0 4px}
  h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
  .flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
  /* ---- stations, scan-to-move, dashboard chart ---- */
  .chart{display:flex;flex-direction:column;gap:9px}
  .bar-row{display:grid;grid-template-columns:132px 1fr 30px;align-items:center;gap:10px}
  .bar-row .cl{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-row .track{background:var(--panel2);border-radius:6px;height:16px;overflow:hidden}
  .bar-row .fill{height:100%;border-radius:6px;transition:width .6s cubic-bezier(.22,1,.36,1)}
  .bar-row .cn{font-size:12px;font-weight:700;text-align:right}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .stn-card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:center}
  .stn-card .qr{background:#fff;padding:10px;border-radius:8px;width:148px;height:148px;margin:0 auto 10px}
  .stn-card h4{margin:0 0 2px;font-size:15px}
  .scan-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin:12px 0}
  .slot{border:1px dashed var(--line);border-radius:10px;padding:12px;min-height:80px;background:var(--panel2);transition:border-color .2s,background .2s}
  .slot.filled{border-style:solid;border-color:var(--accent);background:#17293b}
  .slot .cap{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .slot .v{font-weight:700;margin-top:5px;word-break:break-word}
  .slot .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .feedback{border-radius:10px;padding:11px 14px;margin:6px 0 2px;font-weight:600;display:none}
  .feedback.show{display:block;animation:pop .25s ease}
  .feedback.ok{background:#173a2a;border:1px solid var(--accent2);color:#a6e6c4}
  .feedback.warn{background:#3a3320;border:1px solid var(--warn);color:#f0d79a}
  .feedback.bad{background:#3a2220;border:1px solid var(--danger);color:#f3c0bb}
  @keyframes pop{from{transform:scale(.97);opacity:.35}to{transform:scale(1);opacity:1}}
  .timeline li.scan::before{background:var(--accent2)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .file-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .file-row .fi{min-width:0}
  .file-row .fn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vis-tag{font-size:11px;padding:1px 7px;border-radius:12px}
  .vis-shared{background:#233a44;color:#a9e0ef}
  .vis-internal{background:#3a2f20;color:#f0d79a}
  .dropzone{border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .2s,background .2s}
  .dropzone.hover{border-color:var(--accent);background:#17293b;color:var(--ink)}
  /* ---- branded, role-aware login ---- */
  .login-hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;
    background:radial-gradient(1100px 560px at 18% -10%, #1c3a5e 0%, transparent 60%),
      radial-gradient(900px 480px at 105% 110%, #12414a 0%, transparent 55%),
      linear-gradient(160deg,#0b131c 0%,#0f1a26 100%)}
  .login-box{width:100%;max-width:940px}
  .login-top{text-align:center;margin-bottom:26px}
  .login-top .wm{font-size:34px;font-weight:800;letter-spacing:.5px}
  .login-top .wm span{color:var(--accent)}
  .login-top .tag{color:var(--muted);margin-top:6px;font-size:15px}
  .login-cols{display:grid;grid-template-columns:1.05fr 1.35fr;gap:22px;align-items:start}
  @media(max-width:760px){.login-cols{grid-template-columns:1fr}}
  .login-signin{background:rgba(23,33,46,.92);border:1px solid var(--line);border-radius:16px;padding:24px}
  .login-signin h3{color:var(--ink);text-transform:none;letter-spacing:0;font-size:16px;margin:0 0 12px}
  .role-grid{display:flex;flex-direction:column;gap:12px}
  .role-card{display:flex;gap:13px;background:rgba(30,43,58,.72);border:1px solid var(--line);
    border-radius:14px;padding:14px 16px;transition:transform .15s,border-color .15s}
  .role-card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .role-card .ic{font-size:20px;flex:0 0 auto;width:42px;height:42px;display:flex;align-items:center;
    justify-content:center;border-radius:11px;background:rgba(79,156,249,.12)}
  .role-card h4{margin:0 0 3px;font-size:14px}
  .role-card p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
  .role-card .acc{display:inline-block;font-size:11px;margin-top:6px;padding:1px 8px;border-radius:12px;
    background:rgba(43,182,115,.14);color:var(--accent2)}
  /* ---- live board ---- */
  .board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
  .bcol{flex:0 0 240px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:74vh;overflow-y:auto}
  .bcol h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;background:var(--panel)}
  .bcard{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,transform .15s}
  .bcard:hover{border-color:var(--accent);transform:translateY(-1px)}
  .bcard .c{font-weight:700;font-size:12px}
  .bcard .m{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);display:inline-block;margin-right:5px;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
</style>
</head>
<body>
<div id="app"></div>

<!-- Bundled locally so QR works offline on the lab network -->
<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js"></script>
<script>
const API = '';
let state = { token: null, user: null, statuses: [] };

// ---- tiny helpers ----
const $ = (sel, el=document) => el.querySelector(sel);
const el = (html) => { const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; };
const esc = (s) => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saveToken(t){ state.token=t; if(t) localStorage_shim.set(t); }
// in-memory token store (artifacts can't use localStorage; standalone page can, but keep portable)
const localStorage_shim = { _v:null, set(v){this._v=v;}, get(){return this._v;} };

async function api(path, opts={}) {
  const headers = { 'Content-Type':'application/json', ...(opts.headers||{}) };
  if (state.token) headers.Authorization = 'Bearer '+state.token;
  const res = await fetch(API+path, { ...opts, headers, body: opts.body?JSON.stringify(opts.body):undefined });
  if (res.status === 401) { state.token=null; renderLogin(); throw new Error('unauthorized'); }
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || ('HTTP '+res.status));
  return data;
}
// QR content: once deployed, encode a full link so a normal phone camera opens the record;
// locally (no public URL) encode the bare code for the in-app scanner.
function qrPayload(code){ return state.publicUrl ? (state.publicUrl.replace(/\/+$/,'') + '/?code=' + encodeURIComponent(code)) : code; }
const statusClass = (code) => 's-'+code;
const statusLabel = (code) => (state.statuses.find(s=>s.code===code)||{}).label || code;
// Vivid per-status fills for the dashboard chart (readable on the dark panel).
const STATUS_FILL = { received:'#6f8aa6', registered:'#6c7bd6', in_testing:'#d7b45a',
  on_hold:'#d98b83', completed:'#4fb488', shared:'#4fb0c9', archived:'#7a8794', disposed:'#5f6b76',
  with_industry:'#8f6fd0', in_transit_desy:'#c9a24b', desy_storage:'#6f8aa6', at_beamline:'#3fb6cc',
  measured:'#4fb488', in_transit_return:'#b9924b', returned:'#5cb46f' };
const fmtBytes = (n) => { n=+n||0; if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(1)+' KB';
  if(n<1073741824) return (n/1048576).toFixed(1)+' MB'; return (n/1073741824).toFixed(2)+' GB'; };
// Human-facing role names (backend codes stay admin/member/partner).
const ROLE_LABEL = { admin:'Admin', member:'Beamline Staff', partner:'Industry Partner' };
const roleLabel = (r) => ROLE_LABEL[r] || r;

// ------------------------------------------------------------------
// LOGIN
// ------------------------------------------------------------------
function renderLogin() {
  document.getElementById('app').innerHTML = '';
  const wrap = el(`<div class="login-hero"><div class="login-box">
    <div class="login-top">
      <div class="wm">DESY<span>track</span></div>
      <div class="tag">Sample custody &amp; tracking — from industry, through the beamline, and back.</div>
    </div>
    <div class="login-cols">
      <div class="login-signin">
        <h3>Sign in</h3>
        <label>User ID</label><input id="userid" placeholder="your user ID" autocomplete="username" />
        <label>Password</label><input id="password" type="password" autocomplete="current-password" />
        <div style="margin-top:16px"><button id="go" style="width:100%">Sign in</button></div>
        <div class="err" id="loginErr"></div>
        <div class="hint" style="margin-top:14px">Your access depends on your role. Accounts are issued by your administrator.</div>
      </div>
      <div class="role-grid">
        <div class="role-card"><div class="ic">🔬</div><div>
          <h4>Beamline Staff</h4>
          <p>Logs and edits samples, scans them through each station to advance the journey, records tests, and uploads beamline data files.</p>
          <div class="acc">Full working access</div></div></div>
        <div class="role-card"><div class="ic">🏭</div><div>
          <h4>Industry Partner</h4>
          <p>Follows only their own shared samples — live status, current location and shared data files. Read-only; never sees internal notes or other partners' samples.</p>
          <div class="acc">Limited · read-only</div></div></div>
      </div>
    </div>
  </div></div>`);
  document.getElementById('app').appendChild(wrap);
  if($('#userid')) $('#userid').focus();
  const doLogin = async () => {
    $('#loginErr').textContent='';
    try {
      const r = await api('/api/login', { method:'POST', body:{ username:$('#userid').value, password:$('#password').value }});
      state.token = r.token; state.user = r.user; state.publicUrl = r.publicUrl || '';
      state.statuses = await api('/api/statuses');
      renderApp();
    } catch(e){ $('#loginErr').textContent = e.message; }
  };
  $('#go').onclick = doLogin;
  $('#password').onkeydown = (e)=>{ if(e.key==='Enter') doLogin(); };
}

// ------------------------------------------------------------------
// APP SHELL
// ------------------------------------------------------------------
function renderApp() {
  const u = state.user;
  document.getElementById('app').innerHTML = '';
  const header = el(`<header>
    <div class="brand">DESY<span>track</span></div>
    <div class="who">${esc(u.name)} · <span class="badge">${esc(roleLabel(u.role))}${u.organization?(' · '+esc(u.organization)):''}</span>
      <button class="ghost sm" id="logout" style="margin-left:10px">Sign out</button></div>
  </header>`);
  const main = el(`<main><div id="content"></div></main>`);
  document.getElementById('app').append(header, main);
  $('#logout').onclick = ()=>{ stopBoard(); state.token=null; state.user=null; renderLogin(); };
  renderList();
  // Deep link: /?code=SMP-... (e.g. a QR that encodes a full URL) opens that sample.
  try{
    const params = new URLSearchParams(location.search);
    const deep = extractCode(params.get('code') || location.hash.replace(/^#\/?/, ''));
    if(deep) api('/api/resolve?code=' + encodeURIComponent(deep)).then(r=>renderDetail(r.id)).catch(()=>{});
  }catch(e){}
}

// ------------------------------------------------------------------
// SAMPLE LIST + DASHBOARD
// ------------------------------------------------------------------
async function renderList() {
  stopBoard();
  const c = $('#content');
  const internal = state.user.role!=='partner';
  c.innerHTML = '<div class="muted">Loading…</div>';
  const [stats, samples] = await Promise.all([ api('/api/stats'), api('/api/samples') ]);

  const tiles = stats.map(s=>`<div class="tile"><div class="n">${s.n}</div><div class="l">${esc(s.label)}</div></div>`).join('')
      || '<div class="muted">No samples yet.</div>';
  const total = stats.reduce((a,s)=>a+s.n,0);
  const maxN = Math.max(1, ...stats.map(s=>s.n));
  const chartRows = stats.map(s=>{
    const pct = Math.round(100*s.n/maxN);
    const col = STATUS_FILL[s.status] || '#6f8aa6';
    return `<div class="bar-row"><div class="cl" title="${esc(s.label)}">${esc(s.label)}</div>`
      + `<div class="track"><div class="fill" style="width:${pct}%;background:${col}"></div></div>`
      + `<div class="cn">${s.n}</div></div>`;
  }).join('');

  c.innerHTML = `
    <div class="tiles">${tiles}</div>
    ${stats.length?`<div class="card"><div class="flex-between" style="margin-bottom:12px">
      <h3 style="margin:0">Samples by stage</h3><span class="muted">${total} total</span></div>
      <div class="chart">${chartRows}</div></div>`:''}
    <div class="card">
      <div class="toolbar">
        <input id="q" placeholder="Search name, code, origin…" style="min-width:220px"/>
        <select id="fstatus"><option value="">All statuses</option>
          ${state.statuses.map(s=>`<option value="${s.code}">${esc(s.label)}</option>`).join('')}</select>
        ${internal?'<button id="new">+ New sample</button>':''}
        <button class="ghost" id="scan">⛶ Scan</button>
        ${internal?'<button class="ghost" id="board">📺 Live board</button>':''}
        <div style="flex:1"></div>
        ${internal?'<button class="ghost" id="stations">Stations</button>':''}
        ${internal?'<button class="ghost" id="printLabels">🖶 Labels</button>':''}
        ${internal?'<button class="ghost" id="mgUsers">Users</button>':''}
      </div>
      <table><thead><tr><th>Code</th><th>Name</th><th>Status</th><th>Location</th><th>Custodian</th><th>Updated</th></tr></thead>
      <tbody id="rows"></tbody></table>
    </div>`;

  let listedSamples = samples;
  const draw = (list) => {
    listedSamples = list;
    $('#rows').innerHTML = list.map(s=>`<tr class="click" data-id="${s.id}">
      <td><span class="pill">${esc(s.sample_code)}</span></td>
      <td>${esc(s.name)}</td>
      <td><span class="status ${statusClass(s.status)}">${esc(s.status_label)}</span></td>
      <td class="muted">${esc(s.current_location||'—')}</td>
      <td>${esc(s.custodian_name||'—')}</td>
      <td class="muted">${esc((s.updated_at||'').slice(0,10))}</td></tr>`).join('')
      || '<tr><td colspan="6" class="muted">No matching samples.</td></tr>';
    document.querySelectorAll('#rows tr.click').forEach(tr=>tr.onclick=()=>renderDetail(tr.dataset.id));
  };
  draw(samples);

  const refilter = async ()=>{
    const p = new URLSearchParams();
    if($('#q').value) p.set('q',$('#q').value);
    if($('#fstatus').value) p.set('status',$('#fstatus').value);
    draw(await api('/api/samples?'+p.toString()));
  };
  $('#q').oninput = refilter; $('#fstatus').onchange = refilter;
  if($('#new')) $('#new').onclick = openNewSample;
  if($('#mgUsers')) $('#mgUsers').onclick = openUsers;
  if($('#stations')) $('#stations').onclick = renderStations;
  if($('#board')) $('#board').onclick = renderBoard;
  if($('#printLabels')) $('#printLabels').onclick = ()=>printSampleLabels(listedSamples);
  if($('#scan')) $('#scan').onclick = openScan;
}

// ------------------------------------------------------------------
// SAMPLE DETAIL
// ------------------------------------------------------------------
async function renderDetail(id) {
  const c = $('#content');
  c.innerHTML = '<div class="muted">Loading…</div>';
  const d = await api('/api/samples/'+id);
  const s = d.sample;
  const internal = state.user.role!=='partner';
  const nexts = await api('/api/statuses/'+s.status+'/next');

  const field = (l,v)=>`<div><label>${l}</label><div>${esc(v||'—')}</div></div>`;
  c.innerHTML = `
    <div class="flex-between" style="margin-bottom:10px">
      <button class="ghost sm" id="back">← All samples</button>
      <span class="status ${statusClass(s.status)}">${esc(s.status_label)}</span>
    </div>
    <div class="card">
      <div class="flex-between">
        <div><h2>${esc(s.name)}</h2><div class="muted">${esc(s.sample_code)}</div></div>

// ------------------------------------------------------------------
// SCAN (camera + USB barcode scanner) → open sample by code
// ------------------------------------------------------------------
function extractCode(raw){
  let code = (raw||'').trim();
  if(/^https?:\/\//i.test(code)){
    try{ const u = new URL(code); code = u.searchParams.get('code') || decodeURIComponent((u.pathname.split('/').filter(Boolean).pop())||''); }catch(e){}
  }
  return code.trim();
}
async function openScan(){
  if(state.user.role==='partner') return openScanOpen();  // partners: scan-to-open (read-only)
  let stations=[], users=[];
  try{ [stations, users] = await Promise.all([ api('/api/stations'), api('/api/users') ]); }catch(e){}
  const stnByCode={}; stations.forEach(s=>stnByCode[s.code.toUpperCase()]=s);
  const userById={}; users.forEach(u=>userById[u.id]=u);

  const { bg } = modal(`<h2>Scan &amp; move</h2>
    <div class="muted" style="margin-bottom:8px">Scan a <b>sample</b> and a <b>station</b> in any order (camera, USB scanner, or type below). Optionally scan a <b>handler badge</b> to record who took custody. When a sample and station are both set, it logs automatically.</div>
    <video id="scanVid" playsinline muted style="width:100%;max-height:230px;background:#000;border-radius:8px"></video>
    <div id="scanMsg" class="muted" style="margin-top:6px"></div>
    <div class="scan-slots">
      <div class="slot" id="slotS"><div class="cap">Sample</div><div class="v" id="svS">—</div><div class="sub" id="ssS"></div></div>
      <div class="slot" id="slotT"><div class="cap">Station</div><div class="v" id="svT">—</div><div class="sub" id="ssT"></div></div>
      <div class="slot" id="slotH"><div class="cap">Handler (optional)</div><div class="v" id="svH">—</div><div class="sub" id="ssH"></div></div>
    </div>
    <div class="feedback" id="fb"></div>
    <label>Type / USB-scan a code</label>
    <input id="scanInput" placeholder="SMP-2026-0001 · STN-BEAMLINE · USR-2" autocomplete="off"/>
    <div class="err" id="scanErr"></div>
    <div style="margin-top:14px;display:flex;gap:10px;justify-content:space-between;align-items:center">
      <button class="ghost sm" id="scanReset">Reset</button>
      <div style="display:flex;gap:10px">
        <button class="ghost" id="openRec" disabled>Open record</button>
        <button id="doMove" disabled>Log / move →</button>
      </div>
    </div>
    <div style="text-align:right;margin-top:10px"><button class="ghost sm" id="scanClose">Close</button></div>`);

  const video=$('#scanVid');
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  let stream=null, raf=null, closed=false, busy=false, lastCode='', lastAt=0;
  let sample=null, station=null, handler=null;

  const stop=()=>{ closed=true; if(raf) cancelAnimationFrame(raf); if(stream) stream.getTracks().forEach(t=>t.stop()); };
  const closeAll=()=>{ stop(); bg.remove(); };
  bg.onclick=(e)=>{ if(e.target===bg) closeAll(); };
  $('#scanClose').onclick=closeAll;

  const fb=(cls,msg)=>{ const f=$('#fb'); f.className='feedback show '+cls; f.textContent=msg; };
  const clearFb=()=>{ $('#fb').className='feedback'; };

  function refresh(){
    const set=(slot,v,sub,val)=>{ const S=$(slot); S.classList.toggle('filled',!!val);
      $(v).textContent = val ? val.main : '—'; $(sub).textContent = val ? (val.sub||'') : ''; };
    set('#slotS','#svS','#ssS', sample && { main:sample.code, sub:sample.name||'' });
    set('#slotT','#svT','#ssT', station && { main:station.label, sub:station.location+(station.status_label?(' · → '+station.status_label):'') });
    set('#slotH','#svH','#ssH', handler && { main:handler.name, sub:'takes custody' });
    $('#openRec').disabled = !(sample && sample.id);
    $('#doMove').disabled = !(sample && sample.id && station);
  }
  async function handle(raw){
    const code=extractCode(raw); if(!code) return;
    const now=Date.now(); if(code===lastCode && now-lastAt<1500) return; lastCode=code; lastAt=now;
    $('#scanErr').textContent='';
    const up=code.toUpperCase();
    if(/^STN-/.test(up)){
      const st=stnByCode[up]; if(!st){ $('#scanErr').textContent='Unknown station: '+code; return; }
      station=st; clearFb(); refresh(); maybeMove();
    } else if(/^USR-\d+$/.test(up)){
      const u=userById[Number(up.slice(4))];
      if(!u){ $('#scanErr').textContent='Unknown handler badge: '+code; return; }
      handler={ id:u.id, name:u.full_name }; clearFb(); refresh();
    } else {
      try{ const r=await api('/api/resolve?code='+encodeURIComponent(code));
        sample={ code, id:r.id, name:'' };
        api('/api/samples/'+r.id).then(d=>{ if(sample&&sample.id===r.id){ sample.name=d.sample.name; refresh(); } }).catch(()=>{});
        clearFb(); refresh(); maybeMove();
      }catch(err){ $('#scanErr').textContent=err.message; }
    }
  }
  async function doMove(){
    if(!(sample&&sample.id&&station)||busy) return;
    busy=true; $('#doMove').disabled=true;
    try{
      const body={ sample_code:sample.code, station_code:station.code };
      if(handler) body.handler_code='USR-'+handler.id;
      const r=await api('/api/scan',{method:'POST',body});
      fb(r.statusBlocked?'warn':'ok', r.message);
      sample=null; lastCode='';   // keep station + handler for the next sample (batch at one spot)
      refresh();
    }catch(err){ fb('bad', err.message); }
    finally{ busy=false; }
  }
  function maybeMove(){ if(sample&&sample.id&&station&&!busy) doMove(); }

  $('#doMove').onclick=doMove;
  $('#openRec').onclick=()=>{ if(sample&&sample.id){ closeAll(); renderDetail(sample.id); } };
  $('#scanReset').onclick=()=>{ sample=null; station=null; handler=null; lastCode=''; clearFb(); $('#scanErr').textContent=''; refresh(); };
  const inp0=$('#scanInput'); inp0.focus();
  inp0.onkeydown=(e)=>{ if(e.key==='Enter'){ handle(inp0.value); inp0.value=''; } };

  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } })
      .then(s=>{ if(closed){ s.getTracks().forEach(t=>t.stop()); return; }
        stream=s; video.srcObject=s; video.setAttribute('playsinline',''); video.play(); tick(); })
      .catch(err=>{ $('#scanMsg').textContent='Camera not available ('+err.name+') — use the box below.'; });
  } else { $('#scanMsg').textContent='Camera not supported here — use the box below.'; }
  function tick(){
    if(closed) return;
    if(video.readyState===video.HAVE_ENOUGH_DATA){
      canvas.width=video.videoWidth; canvas.height=video.videoHeight;
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      try{ const img=ctx.getImageData(0,0,canvas.width,canvas.height); const res=jsQR(img.data,img.width,img.height); if(res&&res.data) handle(res.data); }catch(e){}
    }
    raf=requestAnimationFrame(tick);
  }
  refresh();
}

function openScanOpen(){
  const { bg } = modal(`<h2>Scan a sample</h2>
    <div class="muted" style="margin-bottom:8px">Point the camera at a sample's QR label — or scan into the box with a USB barcode scanner, or just type a code and press Enter.</div>
    <video id="scanVid" playsinline muted style="width:100%;max-height:300px;background:#000;border-radius:8px"></video>
    <div id="scanMsg" class="muted" style="margin-top:6px"></div>
    <label>Code (USB scanner or manual)</label>
    <input id="scanInput" placeholder="e.g. SMP-2026-0001" autocomplete="off"/>
    <div class="err" id="scanErr"></div>
    <div style="margin-top:14px;text-align:right"><button class="ghost" id="scanClose">Close</button></div>`);
  const video = $('#scanVid');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  let stream = null, raf = null, busy = false, closed = false;

  const stop = () => { closed = true; if(raf) cancelAnimationFrame(raf); if(stream) stream.getTracks().forEach(t=>t.stop()); };
  const closeAll = () => { stop(); bg.remove(); };
  bg.onclick = (e) => { if(e.target===bg) closeAll(); };
  $('#scanClose').onclick = closeAll;

  async function tryCode(raw){
    const code = extractCode(raw);
    if(!code || busy) return;
    busy = true; $('#scanErr').textContent = '';
    try{
      const r = await api('/api/resolve?code=' + encodeURIComponent(code));
      closeAll();
      renderDetail(r.id);
    }catch(err){
      $('#scanErr').textContent = err.message;
      $('#scanInput').value = '';
      busy = false; // keep scanning / allow retry
    }
  }

  // USB scanner types the code then sends Enter; manual entry works too.
  const inp = $('#scanInput'); inp.focus();
  inp.onkeydown = (e) => { if(e.key==='Enter') tryCode(inp.value); };

  // Camera decode loop (works on localhost and on any https deployment)
  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(s => { if(closed){ s.getTracks().forEach(t=>t.stop()); return; }
        stream = s; video.srcObject = s; video.setAttribute('playsinline',''); video.play(); tick(); })
      .catch(err => { $('#scanMsg').textContent = 'Camera not available (' + err.name + ') — use the box below.'; });
  } else {
    $('#scanMsg').textContent = 'Camera not supported here — use the box below.';
  }
  function tick(){
    if(closed) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA && !busy){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      try{
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const res = jsQR(img.data, img.width, img.height);
        if(res && res.data){ tryCode(res.data); }
      }catch(e){}
    }
    raf = requestAnimationFrame(tick);
  }
}

        </div>`;
      }).join('')}</div>` : '<div class="card muted">No samples to show yet.</div>'}`;
    $('#back').onclick = () => { stopBoard(); renderList(); };

}

async function renderFiles(id, internal){
  const box = $('#files'); if(!box) return;

  try{ files = await api('/api/samples/'+id+'/attachments'); }
  catch(e){ box.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  if(!files.length){ box.innerHTML = '<div class="muted">No data files yet.</div>'; return; }
  box.innerHTML = files.map(f=>`<div class="file-row">
    <div class="fi">
      <div class="fn">${esc(f.filename)}</div>
      <div class="t muted">${esc(f.uploader||'')} · ${esc((f.created_at||'').slice(0,16))} · ${fmtBytes(f.size_bytes)}
        <span class="vis-tag ${f.visibility==='internal'?'vis-internal':'vis-shared'}">${esc(f.visibility)}</span></div>
    </div>
    <div style="display:flex;gap:8px;flex:0 0 auto">
      <button class="sm ghost" data-dl="${f.id}">Download</button>

    </div></div>`).join('');
  box.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>downloadFile(b.dataset.dl));
  box.querySelectorAll('[data-rmf]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Remove this file from the record?')) return;
    try{ await api('/api/attachments/'+b.dataset.rmf,{method:'DELETE'}); renderFiles(id, internal); }catch(e){ alert(e.message); }
  });
}
async function downloadFile(aid){
  try{
    const r = await api('/api/attachments/'+aid+'/link');
    const a = document.createElement('a'); a.href = r.url; a.rel = 'noopener';
    if(/^https?:\/\//i.test(r.url)) a.target = '_blank';   // presigned bucket URL
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ alert(e.message); }
}
function openUpload(id){
  const {close}=modal(`<h2>Upload a data file</h2>
    <div class="muted" style="margin-bottom:10px">Attach beamline scan data or a report to this sample.</div>
    <input type="file" id="upFile"/>
    <label style="margin-top:12px">Visibility</label>
    <select id="upVis"><option value="shared">Shared — the industry partner can see &amp; download it</option>
      <option value="internal">Internal — DESY staff only</option></select>
    <div id="upProg" class="muted" style="margin-top:10px"></div>
    <div class="err" id="e"></div>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">
      <button class="ghost" id="cancel">Cancel</button><button id="save">Upload</button></div>`);
  $('#cancel').onclick=close;
  $('#save').onclick=async()=>{
    const f = $('#upFile').files[0];
    if(!f){ $('#e').textContent='Choose a file first.'; return; }
    $('#e').textContent=''; $('#save').disabled=true;
    $('#upProg').textContent='Uploading '+f.name+' ('+fmtBytes(f.size)+')…';
    try{ await uploadAttachment(id, f, $('#upVis').value); close(); renderDetail(id); }
    catch(err){ $('#e').textContent=err.message; $('#save').disabled=false; $('#upProg').textContent=''; }
  };
}
async function uploadAttachment(sampleId, file, visibility){
  const pre = await api('/api/samples/'+sampleId+'/attachments/presign',{method:'POST',
    body:{ filename:file.name, content_type:file.type||'application/octet-stream' }});
  const headers = { ...(pre.headers||{}) };
  if(pre.storage_mode==='local' && state.token) headers.Authorization = 'Bearer '+state.token; // S3 mode signs via URL
  const put = await fetch(pre.url, { method:'PUT', headers, body:file });
  if(!put.ok) throw new Error('Upload failed ('+put.status+')');
  await api('/api/samples/'+sampleId+'/attachments',{method:'POST',
    body:{ key:pre.key, filename:file.name, content_type:file.type||null, size_bytes:file.size, visibility }});
}

  c.innerHTML = `

    </div>
    <div class="card">
      <h2 style="margin:0 0 4px">Station QR posters</h2>
      <div class="muted" style="margin-bottom:14px">Print a poster for each designated spot and put it up. A technician taps <b>Scan</b>, scans a sample, then this spot (and optionally their own badge) — the sample's location is logged and, where the spot is a stage, its status advances.</div>
      <div class="grid-cards" id="stnCards"></div>
    </div>`;
  $('#back').onclick = renderList;
  const box = $('#stnCards');
  stations.forEach(st=>{
    const card = el(`<div class="stn-card">
      <div class="qr"></div>
      <h4>${esc(st.label)}</h4>
      <div class="muted" style="font-size:12px">${esc(st.location)}</div>
      <div style="margin:8px 0">${st.status_label?`<span class="status ${statusClass(st.set_status)}">→ ${esc(st.status_label)}</span>`:'<span class="pill">location only</span>'}</div>
      <div><span class="pill">${esc(st.code)}</span></div>
      <div style="margin-top:10px"><button class="sm ghost">🖶 Print</button></div>
    </div>`);
    const qr = qrcode(0,'M'); qr.addData(st.code); qr.make();
    card.querySelector('.qr').innerHTML = qr.createSvgTag({cellSize:4,margin:0,scalable:true});
    card.querySelector('button').onclick = ()=>printStation(st, qr);
    box.appendChild(card);
  });
  if($('#addStn')) $('#addStn').onclick = ()=>openStationForm();
  if($('#printAll')) $('#printAll').onclick = ()=>printAllStations(stations);
}
// Bulk-print QR labels for many samples — a grid, many per page, sticker-sized.
function printSampleLabels(list){
  if(!list || !list.length){ alert('No samples to print.'); return; }
  const cells = list.map(s=>{ const qr=qrcode(0,'M'); qr.addData(qrPayload(s.sample_code)); qr.make();
    return `<div class="lbl">${qr.createSvgTag({cellSize:4,margin:0})}<div class="cd">${esc(s.sample_code)}</div><div class="nm">${esc(s.name)}</div></div>`; }).join('');
  const w=window.open('','_blank','width=900,height=1000'); if(!w) return;
  w.document.write(`<html><head><title>Sample QR labels (${list.length})</title>
    <style>@page{margin:10mm} body{font-family:sans-serif;margin:0;padding:8mm}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6mm}
    .lbl{border:1px solid #ccc;border-radius:6px;padding:6px;text-align:center;break-inside:avoid;page-break-inside:avoid}
    .lbl svg{width:34mm;height:34mm}
    .cd{font-weight:bold;font-size:11px;margin-top:3px}
    .nm{font-size:9px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head>
    <body><div class="grid">${cells}</div>
    <scr`+`ipt>window.onload=function(){window.print();}</scr`+`ipt></body></html>`);
  w.document.close();
}
function printStation(st, qr){
  const svg = qr.createSvgTag({cellSize:8,margin:1});
  const w = window.open('','_blank','width=430,height=580'); if(!w) return;
  w.document.write(`<html><head><title>${esc(st.code)}</title>
    <style>body{font-family:sans-serif;text-align:center;margin:28px}
    h1{font-size:22px;margin:14px 0 2px}.loc{color:#444;font-size:14px}
    .tag{display:inline-block;margin-top:8px;padding:3px 10px;border:1px solid #999;border-radius:20px;font-size:13px;color:#333}
    .code{margin-top:8px;color:#666;font-size:12px}.ins{margin:14px auto 0;font-size:12px;color:#555;max-width:300px}</style></head>
    <body>${svg}<h1>${esc(st.label)}</h1><div class="loc">${esc(st.location)}</div>
    ${st.status_label?`<div class="tag">Sets stage → ${esc(st.status_label)}</div>`:'<div class="tag">Location checkpoint</div>'}
    <div class="code">${esc(st.code)}</div>
    <div class="ins">Scan a sample, then scan this poster to log it here${st.status_label?' and advance its stage':''}.</div>
    <scr`+`ipt>window.onload=function(){window.print();}</scr`+`ipt></body></html>`);
  w.document.close();
}
function printAllStations(stations){
  const parts = stations.map(st=>{ const qr=qrcode(0,'M'); qr.addData(st.code); qr.make();
    return `<div class="poster">${qr.createSvgTag({cellSize:6,margin:1})}<h1>${esc(st.label)}</h1>
      <div class="loc">${esc(st.location)}</div>${st.status_label?`<div class="tag">→ ${esc(st.status_label)}</div>`:'<div class="tag">Location</div>'}
      <div class="code">${esc(st.code)}</div></div>`; }).join('');
  const w = window.open('','_blank','width=820,height=900'); if(!w) return;
  w.document.write(`<html><head><title>Station posters</title>
    <style>body{font-family:sans-serif;margin:0}.poster{page-break-after:always;text-align:center;padding:40px}
    h1{font-size:24px;margin:16px 0 4px}.loc{color:#444}.tag{display:inline-block;margin-top:8px;padding:3px 10px;border:1px solid #999;border-radius:20px;font-size:13px}.code{margin-top:8px;color:#666;font-size:12px}</style></head>
    <body>${parts}<scr`+`ipt>window.onload=function(){window.print();}</scr`+`ipt></body></html>`);
  w.document.close();
}
function printBadge(id, name){
  const code='USR-'+id; const qr=qrcode(0,'M'); qr.addData(code); qr.make();
  const svg=qr.createSvgTag({cellSize:7,margin:1});
  const w=window.open('','_blank','width=360,height=460'); if(!w) return;
  w.document.write(`<html><head><title>${esc(code)}</title>
    <style>body{font-family:sans-serif;text-align:center;margin:24px}h2{font-size:18px;margin:12px 0 2px}.r{color:#666;font-size:12px}.ins{margin:12px auto 0;font-size:11px;color:#666;max-width:260px}</style></head>
    <body>${svg}<h2>${esc(name)}</h2><div class="r">${esc(code)} · handler badge</div>
    <div class="ins">Scan at a station to record that you took custody of the sample.</div>
    <scr`+`ipt>window.onload=function(){window.print();}</scr`+`ipt></body></html>`);
  w.document.close();
}
function printAllBadges(users){
  const parts=users.map(u=>{ const code='USR-'+u.id; const qr=qrcode(0,'M'); qr.addData(code); qr.make();
    return `<div class="poster">${qr.createSvgTag({cellSize:6,margin:1})}<h2>${esc(u.full_name)}</h2><div class="r">${esc(code)}</div></div>`; }).join('');
  const w=window.open('','_blank','width=760,height=900'); if(!w) return;
  w.document.write(`<html><head><title>Staff badges</title>
    <style>body{font-family:sans-serif;margin:0}.poster{page-break-after:always;text-align:center;padding:40px}h2{font-size:20px;margin:14px 0 2px}.r{color:#666;font-size:12px}</style></head>
    <body>${parts}<scr`+`ipt>window.onload=function(){window.print();}</scr`+`ipt></body></html>`);
  w.document.close();
}
function openStationForm(){
  const opts = state.statuses.map(s=>`<option value="${s.code}">${esc(s.label)}</option>`).join('');
  const {close}=modal(`<h2>Add / update a spot</h2>
    <div class="grid2">
      <div><label>Code *</label><input id="s_code" placeholder="STN-PACKING"/></div>
      <div><label>Label *</label><input id="s_label" placeholder="Packing Bench"/></div>
      <div><label>Location *</label><input id="s_location" placeholder="Room 3 · Bench C"/></div>
      <div><label>Sets stage to</label><select id="s_status"><option value="">— location only —</option>${opts}</select></div>
      <div><label>Sort order</label><input id="s_sort" type="number" value="20"/></div>
    </div><div class="err" id="e"></div>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">
      <button class="ghost" id="cancel">Cancel</button><button id="save">Save spot</button></div>`);
  $('#cancel').onclick=close;
  $('#save').onclick=async()=>{
    try{ await api('/api/stations',{method:'POST',body:{ code:$('#s_code').value, label:$('#s_label').value,
      location:$('#s_location').value, set_status:$('#s_status').value||null, sort_order:Number($('#s_sort').value)||0 }});
      close(); renderStations(); }
    catch(e){ $('#e').textContent=e.message; }
  };
}

// ------------------------------------------------------------------
// MODALS
// ------------------------------------------------------------------
function modal(inner){
  const bg = el('<div class="modal-bg"></div>');
  const m = el('<div class="modal"></div>'); m.innerHTML = inner; bg.appendChild(m);
  bg.onclick = (e)=>{ if(e.target===bg) bg.remove(); };
  document.body.appendChild(bg);
  return { bg, close:()=>bg.remove() };
}

function sampleForm(s={}, partnerOrgs=[], staff=[]){
  const owns = partnerOrgs.slice();
  if(s.owner_org && !owns.includes(s.owner_org)) owns.push(s.owner_org);
  return `<div class="grid2">
    <div><label>Name *</label><input id="f_name" value="${esc(s.name)}"/></div>
    <div><label>Material type</label><input id="f_material_type" value="${esc(s.material_type)}"/></div>
    <div><label>Batch / lot</label><input id="f_batch_lot" value="${esc(s.batch_lot)}"/></div>
    <div><label>Origin</label><input id="f_origin" value="${esc(s.origin)}"/></div>
    <div><label>Quantity</label><input id="f_quantity" type="number" value="${s.quantity??''}"/></div>
    <div><label>Unit</label><input id="f_unit" value="${esc(s.unit)}"/></div>
    <div><label>Storage location</label><input id="f_storage_location" value="${esc(s.storage_location)}"/></div>
    <div><label>Hazard class</label><input id="f_hazard_class" value="${esc(s.hazard_class||'none')}"/></div>
    <div><label>Custodian (who holds it)</label>
      <select id="f_custodian_id"><option value="">— unassigned —</option>
      ${staff.map(u=>`<option value="${u.id}" ${String(s.custodian_id)===String(u.id)?'selected':''}>${esc(u.full_name)}</option>`).join('')}
      </select></div>
    <div><label>Industry partner (owner)</label>
      <select id="f_owner_org"><option value="">— none / internal —</option>
      ${owns.map(o=>`<option value="${esc(o)}" ${s.owner_org===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select></div>
  </div>
  <label>Description</label><textarea id="f_description" rows="2">${esc(s.description)}</textarea>`;
}
function readSampleForm(){
  const g=(id)=>$('#'+id).value;
  return { name:g('f_name'), material_type:g('f_material_type'), batch_lot:g('f_batch_lot'),
    origin:g('f_origin'), quantity:g('f_quantity')?Number(g('f_quantity')):null, unit:g('f_unit'),
    storage_location:g('f_storage_location'), hazard_class:g('f_hazard_class'),
    custodian_id:g('f_custodian_id')?Number(g('f_custodian_id')):null,
    owner_org:g('f_owner_org')||null, description:g('f_description') };
}
// Load users once → partner orgs (owner dropdown) + internal staff (custodian dropdown).
async function formPeople(){
  try{ const us=await api('/api/users');
    return { orgs:[...new Set(us.filter(u=>u.role==='partner'&&u.organization).map(u=>u.organization))],
             staff:us.filter(u=>u.role!=='partner') }; }
  catch(e){ return { orgs:[], staff:[] }; }
}

async function openNewSample(){
  const {orgs,staff} = await formPeople();
  const {close}=modal(`<h2>New sample</h2>${sampleForm({}, orgs, staff)}<div class="err" id="e"></div>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">
      <button class="ghost" id="cancel">Cancel</button><button id="save">Create</button></div>`);
  $('#cancel').onclick=close;
  $('#save').onclick=async()=>{
    try{ const r=await api('/api/samples',{method:'POST',body:readSampleForm()}); close(); renderDetail(r.id); }
    catch(e){ $('#e').textContent=e.message; }
  };
}
async function openEditSample(s){
  const {orgs,staff} = await formPeople();
  const {close}=modal(`<h2>Edit ${esc(s.sample_code)}</h2>${sampleForm(s, orgs, staff)}<div class="err" id="e"></div>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">
      <button class="ghost" id="cancel">Cancel</button><button id="save">Save</button></div>`);
  $('#cancel').onclick=close;
  $('#save').onclick=async()=>{
    try{ await api('/api/samples/'+s.id,{method:'PUT',body:readSampleForm()}); close(); renderDetail(s.id); }
    catch(e){ $('#e').textContent=e.message; }
  };
}
function openAddTest(id){
  const {close}=modal(`<h2>Log test / analysis</h2>
    <div class="grid2">
      <div><label>Test type *</label><input id="t_type" placeholder="tensile, FTIR, pH…"/></div>
      <div><label>Method / standard</label><input id="t_method" placeholder="ASTM D638"/></div>
      <div><label>Result value</label><input id="t_val"/></div>
      <div><label>Unit</label><input id="t_unit"/></div>
      <div><label>Outcome</label><select id="t_out"><option>pending</option><option>pass</option><option>fail</option><option>inconclusive</option></select></div>
    </div><div class="err" id="e"></div>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">
      <button class="ghost" id="cancel">Cancel</button><button id="save">Save</button></div>`);
  $('#cancel').onclick=close;
  $('#save').onclick=async()=>{
    try{ await api('/api/samples/'+id+'/tests',{method:'POST',body:{
      test_type:$('#t_type').value, method:$('#t_method').value, result_value:$('#t_val').value,
      result_unit:$('#t_unit').value, outcome:$('#t_out').value }}); close(); renderDetail(id); }
    catch(e){ $('#e').textContent=e.message; }
  };
}
async function openAccess(id){
  const [grants, users] = await Promise.all([ api('/api/samples/'+id+'/access'), api('/api/users') ]);
  const partners = users.filter(u=>u.role==='partner');
  const {bg,close}=modal(`<h2>Industry partner access</h2>
    <div id="glist">${grants.map(g=>`<div class="flex-between" style="padding:6px 0;border-bottom:1px solid var(--line)">
      <div>${esc(g.full_name)} <span class="muted">${esc(g.organization||'')}</span></div>
      <button class="sm ghost" data-rm="${g.user_id}">Remove</button></div>`).join('')||'<div class="muted">No partners have access.</div>'}</div>
    <label>Grant access to an industry partner</label>
    <div class="row"><select id="pu" style="flex:3">${partners.map(p=>`<option value="${p.id}">${esc(p.full_name)} — ${esc(p.organization||'')}</option>`).join('')}</select>
    <button id="grant" style="flex:0 0 auto">Grant</button></div>
    <div style="margin-top:16px;text-align:right"><button class="ghost" id="done">Close</button></div>`);
  $('#done').onclick=close;
  $('#grant').onclick=async()=>{ if($('#pu').value){ await api('/api/samples/'+id+'/access',{method:'POST',body:{user_id:Number($('#pu').value)}}); close(); openAccess(id);} };
  bg.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{ await api('/api/samples/'+id+'/access/'+b.dataset.rm,{method:'DELETE'}); close(); openAccess(id); });
}
async function openUsers(){
  const users = await api('/api/users');
  const isAdmin = state.user.role==='admin';
  const {close}=modal(`<div class="flex-between"><h2 style="margin:0">Users</h2>
      <button class="sm ghost" id="printBadges">🖶 Print staff badges</button></div>
    <table><thead><tr><th>Name</th><th>User ID</th><th>Role</th><th>Org</th><th></th></tr></thead><tbody>
    ${users.map(u=>{ const self=u.id===state.user.id; return `<tr style="${u.is_active?'':'opacity:.5'}">
      <td>${esc(u.full_name)}${self?' <span class="pill">you</span>':''}${u.is_active?'':' <span class="pill">disabled</span>'}${u.email?`<div class="muted">${esc(u.email)}</div>`:''}</td>
      <td><span class="pill">${esc(u.username||'—')}</span></td>
      <td><span class="pill">${esc(roleLabel(u.role))}</span></td>
      <td>${esc(u.organization||'—')}</td>
      <td style="text-align:right;white-space:nowrap">
        ${u.role!=='partner'?`<button class="sm ghost" data-badge="${u.id}" data-name="${esc(u.full_name)}">Badge</button>`:''}
        ${isAdmin?`<button class="sm ghost" data-pw="${u.id}" data-name="${esc(u.full_name)}">Reset PW</button>`:''}
        ${isAdmin&&!self?`<button class="sm ghost" data-active="${u.id}" data-to="${u.is_active?0:1}">${u.is_active?'Disable':'Enable'}</button>`:''}
        ${isAdmin&&!self?`<button class="sm ghost" data-del="${u.id}" data-name="${esc(u.full_name)}">Delete</button>`:''}
      </td></tr>`; }).join('')}
    </tbody></table>
    ${isAdmin?`<h3>Onboard a user</h3>
    <div class="muted" style="font-size:12px;margin:-4px 0 8px">Give the person their User ID and a temporary password — they can sign in immediately and you can reset it any time.</div>
    <div class="grid2">
      <div><label>User ID *</label><input id="u_username" placeholder="e.g. acme-jones"/></div>
      <div><label>Full name *</label><input id="u_name"/></div>
      <div><label>Temporary password *</label><input id="u_pw" type="password"/></div>
      <div><label>Role</label><select id="u_role"><option value="partner">Industry Partner</option><option value="member">Beamline Staff</option><option value="admin">Admin</option></select></div>
      <div><label>Organization (for partners)</label><input id="u_org"/></div>
      <div><label>Email (optional)</label><input id="u_email"/></div>
    </div><div class="err" id="e"></div>
    <div style="margin-top:12px;text-align:right"><button id="addU">Create account</button></div>`:''}
    <div style="margin-top:14px;text-align:right"><button class="ghost" id="done">Close</button></div>`);
  $('#done').onclick=close;
  if($('#printBadges')) $('#printBadges').onclick=()=>printAllBadges(users.filter(u=>u.role!=='partner'));
  document.querySelectorAll('[data-badge]').forEach(b=>b.onclick=()=>printBadge(Number(b.dataset.badge), b.dataset.name));
  document.querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>openResetPw(b.dataset.pw, b.dataset.name));
  document.querySelectorAll('[data-active]').forEach(b=>b.onclick=async()=>{
    try{ await api('/api/users/'+b.dataset.active+'/active',{method:'POST',body:{active:b.dataset.to==='1'}}); close(); openUsers(); }
    catch(e){ alert(e.message); }
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Delete user '+b.dataset.name+'? (If they have activity, disable them instead.)')) return;
    try{ await api('/api/users/'+b.dataset.del,{method:'DELETE'}); close(); openUsers(); }
    catch(e){ alert(e.message); }
  });
  if($('#addU')) $('#addU').onclick=async()=>{
    try{ await api('/api/users',{method:'POST',body:{ username:$('#u_username').value, full_name:$('#u_name').value,
      email:$('#u_email').value||null, password:$('#u_pw').value, role:$('#u_role').value, organization:$('#u_org').value }});
      close(); openUsers(); }
    catch(e){ $('#e').textContent=e.message; }
  };
}

function openResetPw(id, name){
  const {close}=modal(`<h2>Reset password</h2>
    <div class="muted" style="margin-bottom:10px">Set a new password for <b>${esc(name)}</b> — tell them the new one and they can sign in with it straight away.</div>
    <label>New password</label><input id="np" type="password" autocomplete="new-password"/>
    <div class="err" id="e"></div>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">
      <button class="ghost" id="cancel">Cancel</button><button id="save">Set password</button></div>`);
  $('#cancel').onclick=close;
  $('#save').onclick=async()=>{
    if(!$('#np').value){ $('#e').textContent='Enter a new password.'; return; }
    try{ await api('/api/users/'+id+'/password',{method:'POST',body:{password:$('#np').value}}); close(); }
    catch(e){ $('#e').textContent=e.message; }
  };
}
